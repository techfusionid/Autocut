services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "9000:8000"
    environment:
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-15728640}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-25000000}
      IMAGE_FETCH_TIMEOUT: ${IMAGE_FETCH_TIMEOUT:-15}
    networks:
      - autocut
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  autocut:
    name: autocut
