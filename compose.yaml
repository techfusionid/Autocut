services:
  api:
    build: .
    image: autocut:local
    environment:
      API_TOKEN: "${API_TOKEN:?Set API_TOKEN in .env before starting Docker}"
      DATA_DIR: /data
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-15728640}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-25000000}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-60}
      MAX_JOB_ATTEMPTS: ${MAX_JOB_ATTEMPTS:-3}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - autocut_data:/data
    networks:
      - autocut
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  worker:
    image: autocut:local
    command: ["python", "-m", "autocut_api.worker", "--poll-interval", "1"]
    environment:
      DATA_DIR: /data
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-25000000}
    volumes:
      - autocut_data:/data
    networks:
      - autocut
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time; p=Path('/data/worker.heartbeat'); raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime < 15 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  autocut_data:

networks:
  autocut:
    name: autocut
